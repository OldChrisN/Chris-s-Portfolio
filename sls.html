<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/png" href="Favicon.png">
        <title>Chris's Art Portfolio</title>
        <link rel="stylesheet" href="sls.css">
        <script defer src="script.JS"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <h1>My SLS renders</h1>
            <a href="index.html">
                <h2>Home Page</h2>
            </a>
        </header>
        <hr>
        <br>

        <div class="slsrow1">
            <div class="slsmorning">
                <img src="SLSRenders/SLSRender1.png" alt="SLS on a launchpad">
                <h3>SLS in the morning</h3>
            </div>

            <div class="slsafternoon">
                <img src="SLSRenders/SLSRender2.png" alt="SLS on a launchpad">
                <h3>SLS in the afternoon</h3>
            </div>

            <div class="capsuleclose">
                <img src="SLSRenders/SLSRender3.png" alt="A close up of the SLS capsule">
                <h3>SLS capsule close up</h3>
            </div>
        </div>

        <hr>
        <br>

        <div class="slsrow2">
            <div class="slsmoon">
                <img src="SLSRenders/SLSRender4bright.png" alt="SLS during evening while the moon is far up in the sky">
                <h3>The goal</h3>
            </div>

            <div class="capsuleclose2">
                <img src="SLSRenders/SLSRender5.png" alt="close up of the capsule while it's night time">
                <h3>SLS capsule close up at night time</h3>
            </div>

            <div class="slsspotlights">
                <img src="SLSRenders/SLSRender6.png" alt="The SLS at night time with spotlights hititng it">
                <h3>Getting ready for launch</h3>
            </div>
        </div>

        <hr>
        <br>

        <div class="Finalrow">
            <div class="Launching">
                <img src="SLSRenders/SLSRender7.png" alt="The SLS launching off">
                <h3>The launch</h3>
            </div>

            <div class="BoomingRocket">
                <img src="SLSRenders/SLSRender8.png" alt="The SLS flying through the sky">
                <h3>The soaring rocket</h3>
            </div>
        </div>
        <hr>
        <br>

        <footer>
            <a href="index.html">
                <h2>
                    Go back to Home Page
                </h2>
            </a>

            <p>© 2026 Christopher Ngankam. All rights reserved.</p>
        </footer>
    </body>
</html>
